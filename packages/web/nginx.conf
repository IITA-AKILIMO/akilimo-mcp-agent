server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; resolving per request lets nginx start before the upstreams exist
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Hashed build assets can be cached indefinitely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # MCP gateway on the Akilimo 1.0 server (mirrors the Vite dev proxy in vite.config.ts): the
    # server registry plus a proxy to every registered MCP server
    location /gateway/ {
        set $gateway http://akilimo-mcp:3000;
        proxy_pass $gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # Accounts, saved chats and activity on the same server. X-Forwarded-Proto lets it mark the
    # session cookie Secure when the site is served over HTTPS.
    location /api/ {
        set $api http://akilimo-mcp:3000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Ollama for the chat mode. ${OLLAMA_UPSTREAM} is filled in from the environment at container
    # start (nginx templates). Origin is dropped and Host set to localhost because Ollama rejects
    # browser origins and hosts it does not know.
    location /proxy/ollama/ {
        set $ollama ${OLLAMA_UPSTREAM};
        rewrite ^/proxy/ollama/(.*)$ /$1 break;
        proxy_pass $ollama;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header Origin "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback; never cache index.html so new builds are picked up
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
