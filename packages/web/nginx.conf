server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS; resolving per request lets nginx start before the upstreams exist
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Hashed build assets can be cached indefinitely
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Same-origin MCP proxies (mirrors the Vite dev proxy in vite.config.ts)
    location /proxy/akilimo-1.0/ {
        set $akilimo1 http://akilimo-mcp:3000;
        rewrite ^/proxy/akilimo-1\.0/(.*)$ /$1 break;
        proxy_pass $akilimo1;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location /proxy/akilimo-2.0/ {
        set $akilimo2 https://mcp.akilimo.org;
        rewrite ^/proxy/akilimo-2\.0/(.*)$ /$1 break;
        proxy_pass $akilimo2;
        proxy_http_version 1.1;
        proxy_set_header Host mcp.akilimo.org;
        proxy_set_header Connection "";
        proxy_ssl_server_name on;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    # SPA fallback; never cache index.html so new builds are picked up
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
