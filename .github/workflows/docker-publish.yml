name: Publish Docker images

# Builds the MCP server and web UI images and pushes them to GitHub Container Registry
# (ghcr.io), not Docker Hub. Pull requests only build. Base images can be pulled from a mirror
# instead of Docker Hub by setting the repository variables NODE_IMAGE and NGINX_IMAGE.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            image: ghcr.io/iita-akilimo/akilimo-mcp-agent
            file: Dockerfile
          - name: web
            image: ghcr.io/iita-akilimo/akilimo-mcp-agent-web
            file: packages/web/Dockerfile
    name: ${{ matrix.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      # latest on main, the version on v* tags, and the commit sha; the OCI labels link the
      # package to this repository on GitHub
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            NODE_IMAGE=${{ vars.NODE_IMAGE || 'node:24-alpine' }}
            NGINX_IMAGE=${{ vars.NGINX_IMAGE || 'nginxinc/nginx-unprivileged:1.27-alpine' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true
