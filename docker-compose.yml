name: akilimo-mcp


services:
  akilimo-mcp:
    build: .
    container_name: akilimo-mcp
    hostname: akilimo-mcp
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      TRANSPORT: sse
      PORT: 3000
      AKILIMO_API_BASE_URL: ${AKILIMO_API_BASE_URL:-https://api.akilimo.org}
      AKILIMO_API_KEY: ${AKILIMO_API_KEY}
      AKILIMO_V2_API_KEY: ${AKILIMO_V2_API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    restart: always
    networks:
      - dokploy-network
      - internal

  webui:
    image: ghcr.io/open-webui/open-webui:main
    hostname: webui
    container_name: webui
    network_mode: host
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://127.0.0.1:11434
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is not set}
    volumes:
      - webui:/app/backend/data
#    depends_on:
#      - akilimo-mcp
    restart: always


networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  webui:
    name: webui
    driver: local
