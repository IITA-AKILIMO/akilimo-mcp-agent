name: akilimo-mcp


services:
  akilimo-mcp:
    build: .
    container_name: akilimo-mcp
    hostname: akilimo-mcp
    ports:
      - "127.0.0.1:3080:3000"
    env_file:
      - .env
    environment:
      TRANSPORT: http
      PORT: 3000
      AKILIMO_API_BASE_URL: ${AKILIMO_API_BASE_URL:-https://api.akilimo.org}
      AKILIMO_API_KEY: ${AKILIMO_API_KEY}
      AKILIMO_DEVICE_TOKEN: ${AKILIMO_DEVICE_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # Optional admin account ensured at start (admins manage MCP servers and user roles)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      # Accounts, saved chats and activity. Migrations run at container start (Prisma).
      # DB_HOST=db uses the bundled db service; point it at another host for an external database
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - mcp-gateway:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - dokploy-network
      - internal

  # Weather MCP server (Open-Meteo, no key). Internal network only; register it in the web UI
  # (Manage) as id "weather", URL http://weather-mcp:8080/mcp, no key.
  weather-mcp:
    build:
      context: docker/weather-mcp
    container_name: weather-mcp
    hostname: weather-mcp
    restart: always
    networks:
      - internal

  db:
    image: postgres:17-alpine
    container_name: akilimo-db
    # Created from the same DB_* values the server uses (they only take effect on first start,
    # when the data volume is empty)
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set}
    volumes:
      - akilimo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    # Internal network only: not published on the host
    networks:
      - internal

  web:
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: akilimo-web
    hostname: akilimo-web
    ports:
      - "127.0.0.1:4173:8080"
    # Chat mode talks to Ollama on the host, the same one Open WebUI uses
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_UPSTREAM: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    restart: always
    # nginx proxies /proxy/akilimo-1.0/ to akilimo-mcp over the internal network
    depends_on:
      - akilimo-mcp
    networks:
      - dokploy-network
      - internal

  webui:
    image: ghcr.io/open-webui/open-webui:main
    hostname: webui
    container_name: webui
    ports:
      - "127.0.0.1:8089:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is not set}
      AKILIMO_API_BASE_URL: ${AKILIMO_API_BASE_URL:-https://api.akilimo.org}
      AKILIMO_API_KEY: ${AKILIMO_API_KEY}
      CORS_ALLOW_ORIGIN: ${ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - webui:/app/backend/data
#    depends_on:
#      - akilimo-mcp
    restart: always
    networks:
      - dokploy-network
      - internal


networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  webui:
    name: webui
    driver: local
  mcp-gateway:
    name: mcp-gateway
    driver: local
  akilimo-db:
    name: akilimo-db
    driver: local
