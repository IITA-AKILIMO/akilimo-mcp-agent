name: akilimo-mcp


services:
  akilimo-mcp:
    # Published to GHCR by .github/workflows/docker-publish.yml; `docker compose build` tags local builds the same
    image: ghcr.io/iita-akilimo/akilimo-mcp-agent:${AKILIMO_MCP_TAG:-latest}
    build: .
    container_name: akilimo-mcp
    hostname: akilimo-mcp
    ports:
      - "127.0.0.1:3080:3000"
    environment:
      TRANSPORT: http
      PORT: 3000
      AKILIMO_API_BASE_URL: ${AKILIMO_API_BASE_URL:-https://api.akilimo.org}
      AKILIMO_API_KEY: ${AKILIMO_API_KEY}
      AKILIMO_DEVICE_TOKEN: ${AKILIMO_DEVICE_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
      # Optional admin account ensured at start (admins manage MCP servers and user roles)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NAME: ${ADMIN_NAME:-Administrator}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      # Accounts, saved chats and activity. The server applies migrations when it starts (Drizzle).
      # DB_HOST=db uses the bundled db service; point it at another host for an external database
      DB_HOST: ${DB_HOST:?DB_HOST must be set}
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
      # Encrypts the LLM provider keys and MCP server keys saved in the database (openssl rand -base64 32).
      # Keep it: a different key cannot decrypt keys saved earlier.
      SECRETS_KEY: ${SECRETS_KEY:-}
      # Ollama for the chat's server-side model calls (admins can override it under Manage, AI providers)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mcp-gateway:/app/data
    restart: always
    networks:
      - dokploy-network
      - internal

  # Weather MCP server (Open-Meteo, no key). Internal network only; register it in the web UI
  # (Manage) as id "weather", URL http://weather-mcp:8080/mcp, no key.
  weather-mcp:
    build:
      context: docker/weather-mcp
    container_name: weather-mcp
    hostname: weather-mcp
    restart: always
    ports:
      - "127.0.0.1:8173:8080"
    networks:
      - internal

  akilimo-web:
    image: ghcr.io/iita-akilimo/akilimo-mcp-agent-web:${AKILIMO_MCP_TAG:-latest}
    build:
      context: .
      dockerfile: packages/web/Dockerfile
    container_name: akilimo-web
    hostname: akilimo-web
    ports:
      - "127.0.0.1:4173:8080"
    # Chat mode talks to Ollama on the host, the same one Open WebUI uses
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_UPSTREAM: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    restart: always
    # nginx proxies /proxy/akilimo-1.0/ to akilimo-mcp over the internal network
    depends_on:
      - akilimo-mcp
    networks:
      - dokploy-network
      - internal

  webui:
    image: ghcr.io/masgeek/open-webui:main
    hostname: webui
    container_name: webui
    ports:
      - "127.0.0.1:8089:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY is not set}
      AKILIMO_API_BASE_URL: ${AKILIMO_API_BASE_URL:-https://api.akilimo.org}
      AKILIMO_API_KEY: ${AKILIMO_API_KEY}
      CORS_ALLOW_ORIGIN: ${ALLOWED_ORIGINS:-http://localhost:5173}
    volumes:
      - webui:/app/backend/data
#    depends_on:
#      - akilimo-mcp
    restart: always
    networks:
      - dokploy-network
      - internal


networks:
  internal:
    name: internal
    external: false
  dokploy-network:
    name: dokploy-network
    external: true

volumes:
  webui:
    name: webui
    driver: local
  mcp-gateway:
    name: mcp-gateway
    driver: local
  akilimo-db:
    name: akilimo-db
    driver: local
